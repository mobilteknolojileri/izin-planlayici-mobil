# very_good_analysis already enables strict-casts, strict-inference and
# strict-raw-types. The versioned include keeps the rule set stable until the
# package is upgraded on purpose.
include: package:very_good_analysis/analysis_options.11.0.0.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/gen/**
    - .tooling/**
    - rakipler/**
    - build/**
    - android/**
