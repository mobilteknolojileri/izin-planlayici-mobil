name: izin_planla
description: "Türkiye'deki çalışanlar için yıllık izin hesaplama, izin takibi ve köprü tatil planlama."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.14.0

# Versions come from docs/araclar.md. pubspec.lock pins the exact build.
dependencies:
  animations: ^3.0.0
  archive: ^4.7.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_picker: ^13.4.0
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^23.0.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.5.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  home_widget: ^0.10.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  liquid_glass_widgets: ^1.19.0
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.11.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  table_calendar: ^3.3.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  alchemist: ^0.15.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/holidays/
    - assets/illustrations/
    - assets/fonts/OFL.txt
  fonts:
    # One variable font file, FontWeight drives its weight axis.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
