<?xml version="1.0" encoding="UTF-8"?>
<!-- Adaptive icon background: the hero card gradient of the app (AppPalette
     blue40 to blue20). The gradient spans the visible 72 dp of the 108 dp
     layer (171 to 853), so every launcher mask shows both ends. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="hero" x1="0" y1="171" x2="0" y2="853" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B4FD8"/>
      <stop offset="1" stop-color="#13277E"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#hero)"/>
</svg>
